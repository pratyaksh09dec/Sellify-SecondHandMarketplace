{% extends "base.html" %}
{% block title %}Edit listing | Sellify{% endblock %}

{% block content %}
<div class="box narrow">
    <h2>Edit: {{ product.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="buttons">
            <button type="submit">Save changes</button>
            <a href="{% url 'product_detail' product.pk %}" class="btn btn-light">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
