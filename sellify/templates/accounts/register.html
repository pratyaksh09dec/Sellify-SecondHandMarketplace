{% extends "base.html" %}
{% block title %}Register | Sellify{% endblock %}

{% block content %}
<div class="box narrow">
    <h2>Create an account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
